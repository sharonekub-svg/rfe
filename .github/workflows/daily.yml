name: daily-mirror

# Runs the Congress trade-mirror on US trading days, near market open.
# GitHub cron is in UTC. US market opens 09:30 ET, which is 13:30 UTC (EDT,
# summer) or 14:30 UTC (EST, winter). We trigger at both and a market-open
# check (via Alpaca's clock) makes the off-season trigger a no-op, so it also
# auto-skips weekends and market holidays.
on:
  schedule:
    - cron: "35 13 * * 1-5"   # 09:35 ET during EDT
    - cron: "35 14 * * 1-5"   # 09:35 ET during EST
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

# Allow the job to commit the updated disclosure-state file back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-mirror
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_BASE_URL: https://paper-api.alpaca.markets/v2
      ALPACA_DATA_URL: https://data.alpaca.markets/v2
      CAPITALTRADES_BASE_URL: https://bff.capitaltrades.com
      DEPLOY_FRACTION: "0.80"
      MAX_POSITION_FRACTION: "0.15"
      MIN_TRADES_12M: "8"
      RANK_UNIVERSE_SIZE: "40"
      TOP_N_LEADERS: "3"
      # Flip to "false" in the repo (or via a secret) to place real paper orders.
      DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Skip if US market is closed
        id: clock
        run: |
          clock=$(curl -s \
            -H "APCA-API-KEY-ID: $ALPACA_API_KEY_ID" \
            -H "APCA-API-SECRET-KEY: $ALPACA_API_SECRET_KEY" \
            https://paper-api.alpaca.markets/v2/clock)
          echo "clock: $clock"
          if echo "$clock" | grep -q '"is_open":true'; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Market closed — skipping today."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily mirror + email
        if: steps.clock.outputs.open == 'true'
        run: python -m congress_mirror.cli daily

      - name: Persist disclosure state
        if: steps.clock.outputs.open == 'true'
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update disclosure state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi

# (registered via re-push)
